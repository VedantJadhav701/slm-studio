<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5AC8FA"/>
      <stop offset="0.55" stop-color="#007AFF"/>
      <stop offset="1" stop-color="#5856D6"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E5F1FF"/>
    </linearGradient>
  </defs>
  <!-- rounded-square app tile -->
  <rect width="1024" height="1024" rx="232" fill="url(#bg)"/>
  <!-- three input streams converging on the core -->
  <g fill="none" stroke="#FFFFFF" stroke-width="58" stroke-linecap="round" opacity="0.92">
    <path d="M200 352 C 330 352, 380 440, 470 480"/>
    <path d="M200 512 L 470 512"/>
    <path d="M200 672 C 330 672, 380 584, 470 544"/>
  </g>
  <!-- core: the validated dataset becoming a model -->
  <circle cx="540" cy="512" r="170" fill="url(#core)"/>
  <circle cx="540" cy="512" r="92" fill="#007AFF"/>
  <!-- output -->
  <path d="M712 512 L 830 512" stroke="#FFFFFF" stroke-width="58" stroke-linecap="round"/>
</svg>
